<!doctype html>
<html>
<head>
    <title>Journal Club</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="my-4">Welcome to the Journal Club</h1>
        <ul class="list-group">
            {% for article in articles %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ article.title }}
                <span class="badge badge-primary badge-pill">{{ article.votes }} votes</span>
                <a href="{{ url_for('vote', article_id=article.id) }}" class="btn btn-outline-primary btn-sm">👍</a>
            </li>
            {% endfor %}
        </ul>
        <div class="mt-4">
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('dashboard') }}" class="btn btn-success">Go to Dashboard</a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
            {% else %}
            <a href="{{ url_for('login') }}" class="btn btn-primary">Login</a>
            <a href="{{ url_for('register') }}" class="btn btn-secondary">Register</a>
            {% endif %}
        </div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="{{ url_for('index') }}">Journal Club</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('user') }}">User Profile</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('settings') }}">Settings</a>
                </li>
            </ul>
        </div>
    </nav>    
</body>
</html>
