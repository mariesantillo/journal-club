{% extends 'base.html' %}
{% block content %}
    <h2 class="my-4">Voting Results</h2>
    <ul class="list-group">
        {% for article, vote_count in results %}
            <div> 
                <h3. {{ results.title }} </h3>
                <p>Votes: {{results.vote_count }}</p>
            </div>
        {% endfor %}
    </ul>
{% endblock %}
