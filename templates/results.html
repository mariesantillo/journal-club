{% extends 'base.html' %}
{% block content %}
    <h2 class="my-4">Voting Results</h2>
    <ul class="list-group">
        {% for article, vote_count in results %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ article.title }}
                <span class="badge badge-primary badge-pill">{{ vote_count }}</span>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
