<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ article['title'] }}</title>
</head>
<body>
    <h1>{{ article['title'] }}</h1>
    <p>Uploaded by: {{ article['uploaded_by'] }}</p>

    {% if pdf_url %}
        <h2>View Article</h2>
        <!-- Embed PDF in the page -->
        <iframe src="{{ pdf_url }}" width="100%" height="600px">
            Your browser does not support iframes.
        </iframe>

        <h2>Download Article</h2>
        <!-- Provide a download link -->
        <a href="{{ pdf_url }}" download>Download PDF</a>
    {% else %}
        <p>No PDF available for this article.</p>
    {% endif %}

    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
</body>
</html>
