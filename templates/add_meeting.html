{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1>Add New Meeting</h1>
    <form method="POST">
        <div class="form-group">
            <label for="meeting_date">Meeting Date (YYYY-MM-DD):</label>
            <input type="text" class="form-control" id="meeting_date" name="meeting_date" required>
        </div>
        <div class="form-group">
            <label for="submission_deadline">Submission Deadline (YYYY-MM-DD):</label>
            <input type="text" class="form-control" id="submission_deadline" name="submission_deadline" required>
        </div>
        <div class="form-group">
            <label for="voting_deadline">Voting Deadline (YYYY-MM-DD):</label>
            <input type="text" class="form-control" id="voting_deadline" name="voting_deadline" required>
        </div>
        <button type="submit" class="btn btn-primary">Add Meeting</button>
    </form>
</div>
{% endblock %}
